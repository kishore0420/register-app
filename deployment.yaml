apiVersion: apps/v1
kind: Deployment
metadata:
  name: register-app
  namespace: register-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: register-app
  template:
    metadata:
      labels:
        app: register-app
    spec:
      containers:
        - name: register-app
          image: 463556655164.dkr.ecr.us-east-1.amazonaws.com/register-app:19
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 8090

---            

apiVersion: v1
kind: Service 
metadata:
  name: register-app
  namespace: register-app
spec:
  selector:
    app: register-app
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
  type: loadBalancer                